name: Deploy Panel to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: حقن مفاتيح Supabase من GitHub Secrets
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.PANEL_SUPABASE_URL }}|g" Config.js
          sed -i "s|__SUPABASE_ANON__|${{ secrets.PANEL_SUPABASE_ANON }}|g" Config.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
